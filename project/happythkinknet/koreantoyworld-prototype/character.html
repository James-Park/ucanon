<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character — KoreanToyWorld</title>
<meta name="description" content="Explore a Korean toy character's world — series, related products and brand. Part of KoreanToyShop.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="ktw-header"></div>

<main>
  <section class="container">
    <div class="breadcrumb" id="crumb"></div>
  </section>

  <!-- HERO (themed with character color) -->
  <section class="container">
    <div class="hero" id="charHero">
      <div class="hero-split">
        <div>
          <span class="badge" id="heroBrand" style="background:rgba(255,255,255,.2);color:#fff"></span>
          <h1 id="heroName"></h1>
          <p class="lead" id="heroKo" style="opacity:.95;margin-bottom:6px"></p>
          <p class="lead" id="heroTag"></p>
          <div class="row wrap" style="margin-top:18px">
            <a class="btn btn-ghost" href="characters.html">← All characters</a>
            <a class="btn btn-primary" href="rankings.html">See rankings</a>
          </div>
        </div>
        <div id="heroArt" style="border-radius:16px;overflow:hidden"></div>
      </div>
    </div>
  </section>

  <!-- SERIES -->
  <section class="section-sm container">
    <div class="section-head" style="margin-bottom:14px">
      <div><div class="kicker">Collectible lines</div><h2 style="font-size:1.5rem">Series</h2></div>
    </div>
    <div class="row wrap" id="seriesChips"></div>
  </section>

  <!-- RELATED PRODUCTS -->
  <section class="section container">
    <div class="section-head">
      <div><div class="kicker">Shop the world</div><h2>Related Products</h2></div>
      <a class="btn btn-ghost btn-sm" href="rankings.html">Full rankings →</a>
    </div>
    <div class="grid grid-4" id="relatedGrid"></div>
  </section>

  <!-- MORE CHARACTERS -->
  <section class="section-sm container">
    <div class="section-head">
      <div><div class="kicker">Keep exploring</div><h2 style="font-size:1.5rem">More Characters</h2></div>
      <a class="btn btn-ghost btn-sm" href="characters.html">All characters →</a>
    </div>
    <div class="grid grid-4" id="moreGrid"></div>
  </section>
</main>

<div id="ktw-footer"></div>
<button class="reward-fab" onclick="KTW.toast('Reward program — Smile.io style (stub)')">🎁 Rewards</button>

<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/components.js"></script>
<script>
  KTW.mountChrome('characters');
  const D = KTW_DATA;

  const slug = KTW.qs('slug') || 'teenieping';
  const c = D.charBySlug[slug] || D.charBySlug['teenieping'];

  document.title = c.name + ' — KoreanToyWorld';

  // Breadcrumb
  document.getElementById('crumb').innerHTML =
    `<a href="index.html">KoreanToyShop</a> › <a href="index.html">World</a> › ` +
    `<a href="characters.html">Characters</a> › <b>${KTW.esc(c.name)}</b>`;

  // Hero — themed with character color
  document.getElementById('charHero').style.background =
    `linear-gradient(135deg, ${c.color} 0%, ${c.color}99 100%)`;
  document.getElementById('heroBrand').textContent = KTW.brandName(c.brand);
  document.getElementById('heroName').textContent = c.name;
  document.getElementById('heroKo').textContent = c.ko;
  document.getElementById('heroTag').textContent = c.tagline;
  document.getElementById('heroArt').innerHTML = KTW.ph(c.name, c.color, c.ko, '280px');

  // Series chips
  document.getElementById('seriesChips').innerHTML =
    (c.series || []).map(s => `<span class="chip">${KTW.esc(s)}</span>`).join('');

  // Related products (NEW items first so a "new" product shows up)
  const related = D.products.filter(p => p.character === slug)
    .sort((a, b) => (b.new ? 1 : 0) - (a.new ? 1 : 0));
  document.getElementById('relatedGrid').innerHTML =
    related.length
      ? related.map(p => KTW.productCard(p)).join('')
      : `<p class="muted">No products yet for this character.</p>`;

  // More characters — 4 others, excluding current
  document.getElementById('moreGrid').innerHTML =
    D.characters.filter(x => x.slug !== slug).slice(0, 4)
      .map(x => KTW.characterCard(x)).join('');
</script>
</body>
</html>
