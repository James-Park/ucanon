<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly K-Toy Rankings — KoreanToyWorld</title>
<meta name="description" content="Weekly K-Toy Rankings — the Top 50 trending Korean character toys, with movement, price and search-trend sparklines. Part of KoreanToyShop.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="ktw-header"></div>

<main>
  <!-- BREADCRUMB -->
  <div class="container">
    <div class="breadcrumb">
      <a href="https://koreantoyshop.com">KoreanToyShop</a> ›
      <a href="index.html">World</a> ›
      <b>Rankings</b>
    </div>
  </div>

  <!-- PAGE HEAD -->
  <section class="container" style="padding-top:8px">
    <div class="section-head">
      <div>
        <div class="kicker">This week</div>
        <h1 style="margin:.1em 0">Weekly K-Toy Rankings</h1>
        <p class="muted" style="margin:6px 0 0">The Top 50 trending Korean character toys — week of Jun 15–21, 2026.</p>
      </div>
      <!-- weekly / monthly toggle (visual stub) -->
      <div class="row" role="group" aria-label="Ranking period">
        <button class="chip is-active" id="periodWeekly">Weekly</button>
        <button class="chip" id="periodMonthly">Monthly</button>
      </div>
    </div>

    <!-- CATEGORY FILTER CHIPS -->
    <div class="row wrap" id="catChips" style="margin-top:4px"></div>
  </section>

  <!-- PODIUM (Top 3 — sponsored ad inventory) -->
  <section class="section-sm container">
    <div class="section-head" style="margin-bottom:14px">
      <div><div class="kicker" style="color:#9a6b00">Sponsored podium</div>
        <h2 style="font-size:1.5rem">This Week's Top 3</h2></div>
      <span class="badge badge-sponsored">Guaranteed-impression ad slots</span>
    </div>
    <div class="podium" id="podium"></div>
  </section>

  <!-- RANKINGS TABLE (4–50) -->
  <section class="section-sm container" style="padding-bottom:56px">
    <div class="section-head" style="margin-bottom:14px">
      <div><div class="kicker">The rest of the chart</div>
        <h2 style="font-size:1.5rem">Ranks 4–50</h2></div>
      <span class="muted" style="font-size:.82rem" id="tableCount"></span>
    </div>
    <div class="card card-pad" style="overflow-x:auto">
      <table class="rank-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>±</th>
            <th></th>
            <th>Toy</th>
            <th>Price</th>
            <th>Trend</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="ktw-footer"></div>
<button class="reward-fab" onclick="KTW.toast('Reward program — Smile.io style (stub)')">🎁 Rewards</button>

<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/components.js"></script>
<script>
  KTW.mountChrome('rankings');
  const D = KTW_DATA;

  // ---- state ----
  let activeCat = 'all';

  // category filter list (slug + label). "all" shows everything.
  const CATS = [
    { slug: 'all',        label: 'All' },
    { slug: 'tayo',       label: 'Tayo' },
    { slug: 'teenieping', label: 'Teenieping' },
    { slug: 'poli',       label: 'Poli' },
    { slug: 'miniforce',  label: 'Miniforce' },
    { slug: 'pinkfong',   label: 'Pinkfong' }
  ];

  // ---- chips ----
  document.getElementById('catChips').innerHTML = CATS.map((c, i) =>
    `<button class="chip${i === 0 ? ' is-active' : ''}" data-cat="${c.slug}">${KTW.esc(c.label)}</button>`
  ).join('');

  document.getElementById('catChips').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    document.querySelectorAll('#catChips .chip').forEach(c => c.classList.toggle('is-active', c === btn));
    render();
  });

  // ---- period toggle (visual stub) ----
  const wBtn = document.getElementById('periodWeekly');
  const mBtn = document.getElementById('periodMonthly');
  mBtn.addEventListener('click', () => {
    mBtn.classList.add('is-active'); wBtn.classList.remove('is-active');
    KTW.toast('Monthly rankings — coming soon (prototype stub)');
  });
  wBtn.addEventListener('click', () => {
    wBtn.classList.add('is-active'); mBtn.classList.remove('is-active');
  });

  // ---- filter helper ----
  function filtered() {
    return activeCat === 'all'
      ? D.rankings
      : D.rankings.filter(r => r.character === activeCat);
  }

  // ---- podium (Top 3 of current filter) ----
  // Visual order silver(2) · gold(1) · bronze(3) so #1 sits centre-tall.
  const SLOTS = [
    { idx: 1, cls: 'pod-silver', label: 'Silver Slot · Sponsored', minh: '210px' },
    { idx: 0, cls: 'pod-gold',   label: 'Gold Slot · Sponsored',   minh: '250px' },
    { idx: 2, cls: 'pod-bronze', label: 'Bronze Slot · Sponsored', minh: '180px' }
  ];

  function pod(r, slot) {
    if (!r) {
      return `<div class="pod ${slot.cls}" style="min-height:${slot.minh};opacity:.55">
        <span class="slot-label badge badge-sponsored">${slot.label}</span>
        <div style="margin-top:30px;font-weight:700">Slot available</div>
        <a class="btn btn-ghost btn-sm" href="advertise.html" style="margin-top:10px">Advertise here →</a></div>`;
    }
    const col = KTW.charColor(r.character);
    return `<div class="pod ${slot.cls}" style="min-height:${slot.minh}">
      <span class="slot-label badge badge-sponsored">${slot.label}</span>
      <div style="margin:6px auto 10px;max-width:96px">
        ${KTW.ph(KTW.charName(r.character).split(' ')[0], col, '', '80px')}
      </div>
      <div style="font-family:Poppins,sans-serif;font-weight:800;font-size:1.6rem;line-height:1">#${r.rank}</div>
      <div style="font-weight:700;margin-top:8px">${KTW.esc(r.name)}</div>
      <div style="opacity:.9;font-size:.82rem;margin-top:2px">${KTW.esc(KTW.brandName(r.brand))}</div>
      <div class="num" style="font-weight:800;font-size:1.15rem;margin-top:8px">${KTW.money(r.now)}</div>
      <a class="btn btn-ghost btn-sm" href="item.html?sku=${r.sku}" style="margin-top:12px">View ↗</a>
    </div>`;
  }

  // ---- render ----
  function render() {
    const rows = filtered();
    const top3 = rows.slice(0, 3);

    // podium
    document.getElementById('podium').innerHTML =
      SLOTS.map(s => pod(top3[s.idx], s)).join('');

    // table: ranks 4–50 of the current filter
    const rest = rows.slice(3);
    const body = document.getElementById('rankBody');
    body.innerHTML = rest.length
      ? rest.map(r => KTW.rankRow(r)).join('')
      : `<tr><td colspan="7" class="muted" style="text-align:center;padding:28px">No further toys in this category this week.</td></tr>`;

    document.getElementById('tableCount').textContent =
      rows.length + ' toys' + (activeCat === 'all' ? '' : ' · ' + KTW.charName(activeCat));
  }

  render();
</script>
</body>
</html>
